name: Product quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked package manager
        run: npm install --global pnpm@11.25.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types, specifications, tests and Mastra rehearsals
        run: npm run quality
      - name: Build Worker and application
        run: npm run build
